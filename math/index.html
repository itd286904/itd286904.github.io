<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Multithreaded Fractal Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="stylesheet" href="controls.css?v=20260409b">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        canvas { display: block; }
        
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        .button-stack {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            pointer-events: auto;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 12px;
            transition: all 0.2s;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
        }

        #credits {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-family: sans-serif;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: auto;
        }
        #credits a { color: inherit; text-decoration: none; }
        #credits a:hover { color: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="status">
            <span id="fps" style="font-weight: bold;">FPS: 0</span> • 
            <span id="zoom-label">Zoom: 0.67x</span>
        </div>

        <div id="control-box" class="control-box">
            <div class="control-group">
                <label>Petals</label>
                <div class="slider-row">
                    <input type="range" id="petals-slider" min="1" max="24" step="1" value="8">
                    <input type="number" class="control-input" id="petals-input" min="1" max="24" step="1" value="8" inputmode="numeric">
                    <span class="val-display" id="val-petals">8</span>
                </div>
            </div>
            <div class="control-group">
                <label>Speed</label>
                <div class="slider-row">
                    <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
                    <input type="text" class="control-input" id="speed-input" min="0" max="5" step="0.1" value="1" inputmode="decimal">
                    <span class="val-display" id="val-speed">1.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>Amplitude</label>
                <div class="slider-row">
                    <input type="range" id="amp-slider" min="1" max="25" step="0.5" value="7">
                    <input type="text" class="control-input" id="amp-input" min="1" max="25" step="0.1" value="7" inputmode="decimal">
                    <span class="val-display" id="val-amp">7.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>Frequency</label>
                <div class="slider-row">
                    <input type="range" id="freq-slider" min="0.5" max="10" step="0.1" value="3">
                    <input type="text" class="control-input" id="freq-input" min="0.5" max="10" step="0.1" value="3" inputmode="decimal">
                    <span class="val-display" id="val-freq">3.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>Complexity</label>
                <div class="slider-row">
                    <input type="range" id="comp-slider" min="1" max="20" step="0.5" value="9">
                    <input type="text" class="control-input" id="comp-input" min="1" max="20" step="0.1" value="9" inputmode="decimal">
                    <span class="val-display" id="val-comp">9.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>Transparency</label>
                <div class="slider-row">
                    <input type="range" id="alpha-slider" min="0.1" max="1.0" step="0.01" value="0.58">
                    <input type="text" class="control-input" id="alpha-input" min="0.1" max="1.0" step="0.01" value="0.58" inputmode="decimal">
                    <span class="val-display" id="val-alpha">58%</span>
                </div>
            </div>
            <div class="control-group">
                <label>Points</label>
                <div class="slider-row">
                    <input type="range" id="points-slider" min="2000" max="50000" step="1000" value="20000">
                    <input type="number" class="control-input" id="points-input" min="2000" max="50000" step="1000" value="20000" inputmode="numeric">
                    <span class="val-display" id="val-points">20k</span>
                </div>
            </div>
            <div class="control-group">
                <div class="toggle-row">
                    <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px;">Symmetry</span>
                    <label class="switch">
                        <input type="checkbox" id="symmetry-toggle" checked>
                        <span class="slider-toggle"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px;">Show Lines</span>
                    <label class="switch">
                        <input type="checkbox" id="line-toggle">
                        <span class="slider-toggle"></span>
                    </label>
                </div>
            </div>
            <div class="control-actions">
                <button class="action-btn" type="button" id="save-config-btn">Save As</button>
                <button class="action-btn" type="button" id="reset-config-btn">Reset</button>
            </div>
            <div class="control-status" id="config-status" aria-live="polite"></div>
        </div>
    </div>

    <div class="button-stack">
        <button class="action-btn" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="action-btn" id="play-pause-btn" onclick="togglePlayPause()">Pause</button>
        <button class="action-btn" onclick="takeScreenshot()">Screenshot</button>
    </div>

    <div id="credits">
        credits to <a href="https://x.com/yuruyurau" target="_blank">@yuruyurau</a> and <a href="https://p5js.org/" target="_blank">p5.js</a>
    </div>

    <!-- WEB WORKER SCRIPT -->
    <script id="worker-script" type="text/worker">
        let canvas, ctx;
        let isMobile = false;
        let dPR = 1;

        self.onmessage = function(e) {
            const { type, w, h, time, mobile, density, logicalW, logicalH, params } = e.data;
            
            if (type === 'init') {
                canvas = e.data.canvas;
                ctx = canvas.getContext('2d');
                isMobile = mobile;
                dPR = density;
            } else if (type === 'render') {
                render(w, h, time, logicalW, logicalH, params);
            }
        };

        function render(w, h, t, logicalW, logicalH, params) {
            if (!ctx) return;
            
            ctx.clearRect(0, 0, w, h);
            
            const mX = w / 2;
            const mY = h / 2;
            
            const S = (Math.min(logicalW, logicalH) / 350) * dPR;
            
            const showLines = params.showLines;
            const baseSW = isMobile ? 0.70 : 0.80;
            const sw = (showLines ? baseSW / 2 : baseSW) * dPR;

            const amp = params.amp;
            const freq = params.freq;
            const comp = params.comp;
            const count = params.count;
            const alpha = params.alpha;
            
            const zoom = params.zoom;

            if (showLines) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = sw;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const strandCount = 25;
                const pointsPerStrand = Math.floor(count / strandCount);

                for (let kIdx = 0; kIdx < strandCount; kIdx++) {
                    const k = kIdx - 12;
                    ctx.beginPath();
                    let first = true;

                    for (let step = 0; step < pointsPerStrand; step++) {
                        const i = step * strandCount + kIdx; 
                        const e = i / 800;
                        const d = amp * Math.cos(Math.hypot(k, e) / freq + t / 2);
                        
                        const rawX = (k * 4 + d * k * Math.sin(d + e / comp + t));
                        const rawY = (e * 2 - d * 9 - d * 9 * Math.cos(d + t));
                        
                        const px = (rawX * zoom) * S + mX;
                        const py = (rawY * zoom) * S + mY;
                        
                        if (first) {
                            ctx.moveTo(px, py);
                            first = false;
                        } else {
                            ctx.lineTo(px, py);
                        }
                    }
                    ctx.stroke();
                }
            } else {
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                for (let i = count; i--;) {
                    if (i > 8) {
                        let k = i % 25 - 12;
                        let e = i / 800;
                        let d = amp * Math.cos(Math.hypot(k, e) / freq + t / 2);
                        
                        const rawX = (k * 4 + d * k * Math.sin(d + e / comp + t));
                        const rawY = (e * 2 - d * 9 - d * 9 * Math.cos(d + t));
                        
                        const px = (rawX * zoom) * S + mX;
                        const py = (rawY * zoom) * S + mY;
                        
                        ctx.fillRect(px - sw/2, py - sw/2, sw, sw);
                    }
                }
            }

            self.postMessage({ type: 'rendered' });
        }
    </script>

    <script src="controls.js?v=20260409b"></script>
    <script>
        let fractalTime = 0;
        let viewZoom = 0.67; 
        let viewOffsetX = 0;
        let viewOffsetY = 0;
        let lastPinchDist = 0;
        let prevMouseX, prevMouseY;
        let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        let isPaused = false;
        let loadStartTime = 0;

        let worker;
        let offscreenCanvas; 
        let workerBusy = false;

        const params = {
            amp: 7,
            freq: 3,
            comp: 9,
            count: 20000,
            petals: 8,
            speed: 1.0,
            alpha: 0.58,
            showLines: false,
            showSymmetry: true
        };

        function toggleFullscreen() {
            fullscreen(!fullscreen());
        }

        function togglePlayPause() {
            isPaused = !isPaused;
            document.getElementById('play-pause-btn').innerText = isPaused ? 'Play' : 'Pause';
        }

        function takeScreenshot() {
            saveCanvas('fractal_explorer_' + floor(Date.now() / 1000), 'png');
        }

        function setup() {
            const w = max(1, windowWidth * 0.99);
            const h = max(1, windowHeight * 0.99);
            createCanvas(w, h);
            const dPR = displayDensity();
            pixelDensity(dPR);
            
            loadStartTime = millis();

            const blob = new Blob([document.getElementById('worker-script').textContent], { type: 'text/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            const bufferSize = min(w, h) * dPR;
            offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = bufferSize;
            offscreenCanvas.height = bufferSize;
            
            const offscreen = offscreenCanvas.transferControlToOffscreen();

            worker.postMessage({ 
                type: 'init', 
                canvas: offscreen, 
                mobile: isMobile,
                density: dPR
            }, [offscreen]);

            worker.onmessage = (e) => {
                if (e.data.type === 'rendered') workerBusy = false;
            };

            AnimationControls.createPageControls({
                pageId: 'index',
                params,
                controls: [
                    { key: 'petals', kind: 'range', inputId: 'petals-slider', numberInputId: 'petals-input', displayId: 'val-petals', min: 1, max: 24, step: 1, defaultValue: 8, formatValue: (value) => String(value) },
                    { key: 'speed', kind: 'range', inputId: 'speed-slider', numberInputId: 'speed-input', displayId: 'val-speed', min: 0, max: 5, step: 0.1, defaultValue: 1.0, formatValue: (value) => value.toFixed(1) },
                    { key: 'amp', kind: 'range', inputId: 'amp-slider', numberInputId: 'amp-input', displayId: 'val-amp', min: 1, max: 25, step: 0.5, defaultValue: 7, formatValue: (value) => value.toFixed(1) },
                    { key: 'freq', kind: 'range', inputId: 'freq-slider', numberInputId: 'freq-input', displayId: 'val-freq', min: 0.5, max: 10, step: 0.1, defaultValue: 3, formatValue: (value) => value.toFixed(1) },
                    { key: 'comp', kind: 'range', inputId: 'comp-slider', numberInputId: 'comp-input', displayId: 'val-comp', min: 1, max: 20, step: 0.5, defaultValue: 9, formatValue: (value) => value.toFixed(1) },
                    { key: 'alpha', kind: 'range', inputId: 'alpha-slider', numberInputId: 'alpha-input', displayId: 'val-alpha', min: 0.1, max: 1.0, step: 0.01, defaultValue: 0.58, formatValue: (value) => `${Math.round(value * 100)}%` },
                    { key: 'count', kind: 'range', inputId: 'points-slider', numberInputId: 'points-input', displayId: 'val-points', min: 2000, max: 50000, step: 1000, defaultValue: 20000, formatValue: (value) => `${value / 1000}k` },
                    { key: 'showSymmetry', kind: 'checkbox', inputId: 'symmetry-toggle', defaultValue: true },
                    { key: 'showLines', kind: 'checkbox', inputId: 'line-toggle', defaultValue: false }
                ]
            }).initialize();

            background(0);
        }

        function draw() {
            background(0);
            
            const centerX = width / 2;
            const centerY = height / 2;
            const cappedDelta = min(deltaTime, 100);

            if (!isPaused) {
                fractalTime += (PI / 180) * (cappedDelta / 16.67) * params.speed;
            }

            if (!workerBusy) {
                workerBusy = true;
                
                let fadeProgress = Math.min(1, (millis() - loadStartTime) / 1000);
                
                worker.postMessage({
                    type: 'render',
                    w: offscreenCanvas.width,
                    h: offscreenCanvas.height,
                    logicalW: width,
                    logicalH: height,
                    time: fractalTime,
                    params: { 
                        ...params,
                        alpha: params.alpha * fadeProgress,
                        count: Math.floor(params.count * fadeProgress),
                        zoom: viewZoom
                    } 
                });
            }

            push();
            // Apply global pan
            translate(viewOffsetX, viewOffsetY);
            
            const ctx = drawingContext;
            
            const petalCount = params.showSymmetry ? params.petals : 1;
            
            for (let r = 0; r < petalCount; r++) {
                push();
                translate(centerX, centerY);
                if (params.showSymmetry) {
                    rotate(r * (TWO_PI / params.petals));
                }
                ctx.drawImage(offscreenCanvas, -centerX, -centerY, width, height);
                pop();
            }
            pop();
            
            document.getElementById('fps').innerText = `FPS: ${floor(frameRate())}`;
            document.getElementById('zoom-label').innerText = `Zoom: ${viewZoom.toFixed(2)}x`;
        }

        function mouseWheel(event) {
            if (isOverUi(mouseX, mouseY)) return false;
            viewZoom = constrain(viewZoom - event.delta * 0.001 * viewZoom, 0.05, 50);
            return false;
        }

        function mousePressed() {
            if (isOverUi(mouseX, mouseY)) return;
            prevMouseX = mouseX; prevMouseY = mouseY;
        }

        function mouseDragged() {
            if (touches.length < 2) {
                if (prevMouseX !== undefined) {
                    viewOffsetX += (mouseX - prevMouseX);
                    viewOffsetY += (mouseY - prevMouseY);
                    prevMouseX = mouseX; prevMouseY = mouseY;
                }
            }
        }

        function isOverUi(pointerX, pointerY) {
            const canvasElement = document.querySelector('canvas');
            if (!canvasElement) return false;
            const bounds = canvasElement.getBoundingClientRect();
            const viewportX = bounds.left + pointerX;
            const viewportY = bounds.top + pointerY;

            return AnimationControls.isPointInsideElement('#control-box', viewportX, viewportY)
                || AnimationControls.isPointInsideElement('.button-stack', viewportX, viewportY)
                || AnimationControls.isPointInsideElement('#credits', viewportX, viewportY);
        }

        function touchMoved() {
            if (touches.length === 2) {
                let d = dist(touches[0].x, touches[0].y, touches[1].x, touches[1].y);
                if (lastPinchDist > 0) viewZoom = constrain(viewZoom + (d - lastPinchDist) * 0.01 * viewZoom, 0.05, 50);
                lastPinchDist = d;
            } else if (prevMouseX !== undefined) {
                viewOffsetX += (touches[0].x - prevMouseX);
                viewOffsetY += (touches[0].y - prevMouseY);
                prevMouseX = touches[0].x; prevMouseY = touches[0].y;
            }
            return false;
        }

        function touchStarted() {
            if (touches.length === 2) {
                lastPinchDist = dist(touches[0].x, touches[0].y, touches[1].x, touches[1].y);
            } else {
                if (isOverUi(touches[0].x, touches[0].y)) {
                    prevMouseX = undefined;
                    return;
                }
                prevMouseX = touches[0].x; prevMouseY = touches[0].y; 
            }
        }

        function touchEnded() { 
            lastPinchDist = 0; 
            prevMouseX = undefined;
        }

        function windowResized() {
            const w = max(1, windowWidth * 0.99);
            const h = max(1, windowHeight * 0.99);
            resizeCanvas(w, h);
            const dPR = displayDensity();
            offscreenCanvas.width = w * dPR;
            offscreenCanvas.height = h * dPR;
        }
    </script>
</body>
</html>
